<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bingo — Tela do sorteio</title>
<meta name="theme-color" content="#0f1220">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎱</text></svg>">
<style>
  @font-face {
    font-family: 'Inter Variable';
    font-style: normal;
    font-display: swap;
    font-weight: 100 900;
    src: url(fonts/inter-latin-wght-normal.woff2) format('woff2-variations');
  }
  :root {
    color-scheme: dark;
    --bg: #0a0b0f;
    --surface: #13151b;
    --surface-2: #1b1e26;
    --text: #eef0f5;
    --dim: #8c93a4;
    --l-b: #3b82f6; --l-i: #ef4444; --l-n: #a78bfa; --l-g: #22c55e; --l-o: #f59e0b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); }
  body {
    font-family: 'Inter Variable', Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }
  .stage {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr);
    grid-template-rows: 1fr auto;
    gap: 3vmin;
    height: 100%;
    padding: 4vmin;
    background: radial-gradient(60vw 60vh at 20% 30%, color-mix(in srgb, var(--ball, #f59e0b) 18%, transparent), transparent 70%);
    transition: background .6s ease;
  }
  .hero { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3vmin; min-width: 0; }
  .ball {
    --ball: #f59e0b;
    width: min(38vw, 62vh);
    height: min(38vw, 62vh);
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #111318;
    background:
      radial-gradient(circle at 50% 50%, #fff 0 54%, rgba(0,0,0,.12) 55%, transparent 57%),
      radial-gradient(circle at 32% 26%, color-mix(in srgb, var(--ball) 55%, #fff) 0%, var(--ball) 45%, color-mix(in srgb, var(--ball) 60%, #000) 100%);
    box-shadow: inset 0 -2vmin 4vmin rgba(0,0,0,.25), 0 4vmin 10vmin -4vmin color-mix(in srgb, var(--ball) 70%, transparent);
    transition: transform .15s ease;
  }
  .ball[hidden] { display: none; }
  .ball.is-bouncing { animation: bounce .5s cubic-bezier(.3,1.4,.5,1); }
  @keyframes bounce {
    0% { transform: scale(.6) rotate(-20deg); opacity: .2; }
    60% { transform: scale(1.06) rotate(4deg); opacity: 1; }
    100% { transform: scale(1) rotate(0); }
  }
  .ball__letter { font-size: min(5vw, 8vh); font-weight: 800; line-height: 1; color: color-mix(in srgb, var(--ball) 70%, #000); }
  .ball__number { font-size: min(15vw, 24vh); font-weight: 800; line-height: .95; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
  .stats { font-size: min(2.2vw, 3.2vh); color: var(--dim); margin: 0; font-weight: 500; }
  .stats strong { color: var(--text); font-weight: 800; }
  .side { display: flex; flex-direction: column; gap: 2.4vmin; min-width: 0; justify-content: center; }
  .label { font-size: min(1.4vw, 2.2vh); font-weight: 600; color: var(--dim); margin: 0 0 1vmin; }
  .recent { display: flex; gap: 1.2vmin; flex-wrap: nowrap; overflow: hidden; }
  .recent__ball {
    --ball: #888;
    flex: 0 0 auto;
    width: min(5.4vw, 8.5vh);
    height: min(5.4vw, 8.5vh);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: min(2vw, 3.2vh);
    font-variant-numeric: tabular-nums;
    background: color-mix(in srgb, var(--ball) 16%, var(--surface));
    border: .35vmin solid color-mix(in srgb, var(--ball) 60%, transparent);
  }
  .board { display: flex; flex-direction: column; gap: 1vmin; background: var(--surface); border: 1px solid #22252f; border-radius: 2vmin; padding: 2vmin; }
  .board__row { display: grid; grid-template-columns: min(3.4vw, 5vh) repeat(var(--cols, 15), minmax(0, 1fr)); gap: .7vmin; align-items: center; }
  .board__letter { font-weight: 800; font-size: min(2.4vw, 3.6vh); text-align: center; color: var(--lc); }
  .board__num {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: .9vmin;
    background: var(--surface-2);
    color: #4a5060;
    font-weight: 700;
    font-size: min(1.5vw, 2.3vh);
    font-variant-numeric: tabular-nums;
    transition: background .3s ease, color .3s ease;
  }
  .board__num.is-drawn { background: var(--lc); color: #fff; }
  .board__num.is-last { box-shadow: 0 0 0 .4vmin var(--bg), 0 0 0 .8vmin #fff; }
  .msg { grid-column: 1 / -1; grid-row: 1 / -1; align-self: center; justify-self: center; text-align: center; max-width: 900px; padding: 0 20px; font-size: min(3.4vw, 4vh); color: var(--dim); margin: 0; }
  .msg[hidden] { display: none; }
  .msg strong { display: block; color: var(--text); font-size: 1.4em; margin-bottom: .3em; letter-spacing: -.02em; }
  .stage.is-idle .hero, .stage.is-idle .side { display: none; }
  .footer { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; color: #4a5060; font-size: min(1.3vw, 2vh); font-weight: 600; }
  .footer__brand { display: flex; align-items: center; gap: 1vmin; }
  .footer__dot { width: 1vmin; height: 1vmin; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 .5vmin rgba(34,197,94,.2); }
  .prize-banner { position: fixed; top: 3vmin; left: 50%; transform: translateX(-50%); z-index: 5; display: flex; align-items: center; gap: 1.4vmin; padding: 1vmin 2.6vmin; border-radius: 999px; background: rgba(245,158,11,.14); border: 1px solid rgba(245,158,11,.4); color: #fbbf24; font-size: min(2vw, 3vh); white-space: nowrap; max-width: 90vw; overflow: hidden; text-overflow: ellipsis; }
  .prize-banner[hidden] { display: none; }
  .prize-banner span { text-transform: uppercase; letter-spacing: .12em; font-size: .7em; font-weight: 700; opacity: .85; }
  .prize-banner strong { color: #fff; font-weight: 800; }
  .footer__right { display: flex; gap: 2vmin; align-items: center; }
  .footer a { color: inherit; text-decoration: none; }
  .footer a:hover { text-decoration: underline; }
  .winner { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 35%, rgba(245,158,11,.30), transparent 60%), #08090c; animation: fade .4s ease; }
  .winner[hidden] { display: none; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .winner__card { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 1.6vmin; animation: pop .6s cubic-bezier(.3,1.5,.5,1); }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .winner__title { margin: 0; font-size: min(16vw, 22vh); font-weight: 900; letter-spacing: -.04em; line-height: .9; background: linear-gradient(180deg, #fde68a, #f59e0b); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .winner__name { margin: 0; font-size: min(6vw, 8vh); font-weight: 800; }
  .winner__meta { margin: 0; font-size: min(2.6vw, 3.6vh); color: var(--dim); }
  .winner__meta strong { color: #fbbf24; }
  .winner__grid { display: grid; grid-template-columns: repeat(5, min(6vw, 8vh)); gap: .8vmin; margin-top: 1vmin; }
  .winner__grid span { aspect-ratio: 1; border-radius: 1vmin; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: min(2vw, 2.8vh); background: var(--surface-2); color: #4a5060; font-variant-numeric: tabular-nums; }
  .winner__grid span.on { background: #f59e0b; color: #1a1205; }
  .winner__grid span.free { font-size: min(1vw, 1.4vh); }
  .share-qr { position: fixed; right: 3vmin; bottom: 9.5vmin; z-index: 6; display: flex; gap: 2vmin; align-items: flex-end; }
  .share-qr[hidden] { display: none; }
  .share-qr figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: .8vmin; }
  .share-qr .qr-tile { width: min(9vw, 14vh); height: min(9vw, 14vh); background: #fff; border-radius: 1.2vmin; padding: .7vmin; box-shadow: 0 1vmin 3vmin rgba(0,0,0,.5); }
  .share-qr .qr-tile svg { width: 100%; height: 100%; display: block; }
  .share-qr figcaption { font-size: min(1.1vw, 1.7vh); font-weight: 700; color: var(--text); text-align: center; line-height: 1.2; max-width: min(11vw, 17vh); }
  .share-qr figcaption span { display: block; font-weight: 500; color: var(--dim); }
  .sound-btn { position: fixed; bottom: 7vmin; left: 50%; transform: translateX(-50%); z-index: 30; border: 1px solid #333846; background: #1b1e26; color: #eef0f5; font: 600 16px inherit; font-family: inherit; padding: 12px 20px; border-radius: 999px; cursor: pointer; }
  .sound-btn[hidden] { display: none; }

  /* Modo "Só a bola" (Configurações > Exibição > Como o telão aparece). */
  .stage.is-ball-only { grid-template-columns: 1fr; }
  .stage.is-ball-only .side { display: none; }
  .stage.is-ball-only .ball { width: min(84vw, 72vh); height: min(84vw, 72vh); }
  .stage.is-ball-only .ball__letter { font-size: min(10vw, 9vh); }
  .stage.is-ball-only .ball__number { font-size: min(32vw, 30vh); }
  .stage.is-ball-only .stats { font-size: min(3.4vw, 3.6vh); }
  @media (max-aspect-ratio: 1/1) {
    body { overflow: auto; }
    .stage { grid-template-columns: 1fr; grid-template-rows: auto auto auto; height: auto; min-height: 100%; }
    .ball { width: min(70vw, 44vh); height: min(70vw, 44vh); }
    .ball__letter { font-size: min(9vw, 6vh); }
    .ball__number { font-size: min(28vw, 17vh); }
    .stats { font-size: 4vw; }
    .label { font-size: 3.4vw; }
    .recent__ball { width: 10vw; height: 10vw; font-size: 3.6vw; }
    .board__row { grid-template-columns: 6vw repeat(var(--cols, 15), minmax(0, 1fr)); gap: .6vw; }
    .board__letter { font-size: 4vw; }
    .board__num { font-size: 2.4vw; border-radius: 1vw; }
    .footer { font-size: 3vw; }
  }
</style>
</head>
<body>
  <div class="prize-banner" id="prizeBanner" hidden><span>Valendo</span><strong id="prizeName"></strong></div>
  <div class="stage is-idle" id="stage">
    <section class="hero">
      <div class="ball" id="ball" hidden>
        <span class="ball__letter" id="letter">-</span>
        <span class="ball__number" id="number">--</span>
      </div>
      <p class="stats" id="stats"></p>
    </section>
    <section class="side">
      <div>
        <p class="label">Últimas bolas</p>
        <div class="recent" id="recent"></div>
      </div>
      <div class="board" id="board"></div>
    </section>
    <p class="msg" id="emptyHint" hidden><strong>Já vai começar!</strong>Aguardando a primeira bola do sorteio…</p>
    <p class="msg" id="inactiveHint" hidden><strong>Sessão encerrada</strong>O operador saiu do aplicativo. Esta tela volta a funcionar assim que ele entrar de novo e iniciar um sorteio.</p>
    <footer class="footer"><span class="footer__brand"><span class="footer__dot"></span>BINGO · ao vivo</span><span class="footer__right"><a href="privacidade.html" target="_blank" rel="noopener">Privacidade</a><span id="clock"></span></span></footer>
  </div>

  <div class="winner" id="winner" hidden>
    <div class="winner__card">
      <p class="winner__title">BINGO!</p>
      <p class="winner__name" id="winnerName"></p>
      <p class="winner__meta" id="winnerMeta"></p>
      <div class="winner__grid" id="winnerGrid"></div>
    </div>
  </div>
  <aside class="share-qr" id="shareQr" hidden aria-label="QR Codes para o público"></aside>
  <button type="button" class="sound-btn" id="soundBtn" hidden>🔊 Toque para ativar a voz</button>

<script src="vendor/qrcode/qrcode.js"></script>
<script src="js/voice.js"></script>
<script src="js/display.js"></script>
</body>
</html>
