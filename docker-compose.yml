services:
  postgres:
    image: postgres:16-alpine
    container_name: bingo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bingo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bingo
    volumes:
      - bingo-postgres-data:/var/lib/postgresql/data

  api:
    build: ./api
    container_name: bingo-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://bingo:${POSTGRES_PASSWORD}@postgres:5432/bingo?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      SEED_MASTER_EMAIL: ${SEED_MASTER_EMAIL}
      SEED_MASTER_PASSWORD: ${SEED_MASTER_PASSWORD}
      SEED_MASTER_FORCE_RESET: ${SEED_MASTER_FORCE_RESET:-false}
      PORT: 4000
    depends_on:
      - postgres

  bingo:
    build: .
    container_name: bingo
    restart: unless-stopped
    ports:
      # Só 8082 — a porta 80 da VPS já pertence a outro app (ver deploy
      # de 2026-09-17). O domínio aponta pra 163.176.182.42:8082, então
      # o Bingo não precisa da 80 pra ser acessado.
      - "8082:80"
    volumes:
      # Onde o Certbot grava o desafio ACME (ver nginx.conf) para
      # emitir/renovar o certificado de bingo.sauberlich.com.br.
      - ./certbot-webroot:/var/www/certbot:ro
    depends_on:
      - api

volumes:
  bingo-postgres-data:
