# Acesso direto por IP (ex.: http://SEU-IP:8082), do jeito que já
# funcionava antes de existir domínio/HTTPS — continua igual.
server {
    listen 80 default_server;
    server_name _;
    include /etc/nginx/snippets/bingo-common.conf;
}

# Acesso pelo domínio (bingo.sauberlich.com.br). A location do desafio
# ACME fica aqui desde já: é o que o Certbot usa (método webroot) tanto
# para emitir o certificado a primeira vez quanto para renová-lo depois
# — nada aqui depende do certificado já existir.
#
# OBS: o bloco "listen 443 ssl" com o certificado entra numa PRÓXIMA
# atualização deste arquivo, só depois que o certificado já existir de
# fato em /etc/letsencrypt no host — apontar ssl_certificate para um
# arquivo que ainda não existe faz o nginx inteiro falhar ao subir.
server {
    listen 80;
    server_name bingo.sauberlich.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/snippets/bingo-common.conf;
}
