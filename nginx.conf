# Navegador passa a usar só HTTPS neste domínio por 6 meses, mas só
# depois que a conexão já veio por HTTPS (ver docker/40-bingo-https.sh).
map $https $bingo_hsts {
    on      "max-age=15552000";
    default "";
}

# Acesso direto por IP (ex.: http://SEU-IP:8082), do jeito que já
# funcionava antes de existir domínio/HTTPS — continua igual.
server {
    listen 80 default_server;
    server_name _;
    include /etc/nginx/snippets/bingo-common.conf;
}

# Acesso pelo domínio (bingo.sauberlich.com.br). A location do desafio
# ACME fica aqui desde já: é o que o Certbot usa (método webroot) tanto
# para emitir o certificado a primeira vez quanto para renová-lo depois
# — nada aqui depende do certificado já existir.
#
# O bloco "listen 443 ssl" é gerado ao subir o container por
# docker/40-bingo-https.sh, só quando o certificado já existe em
# /etc/letsencrypt — apontar ssl_certificate para um arquivo que ainda
# não existe faria o nginx inteiro falhar ao subir.
server {
    listen 80;
    server_name bingo.sauberlich.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/snippets/bingo-common.conf;
}
