server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # HTML files change with every deploy — never let a browser/proxy cache
    # a stale version of the app shell.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # CSS/JS are safe to cache for a while; redeploys serve new bytes at
    # the same path, so a short TTL is enough to avoid stale assets.
    location ~* \.(?:css|js)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
