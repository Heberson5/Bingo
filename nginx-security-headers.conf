# Cabeçalhos de segurança comuns — num arquivo à parte (em vez de só
# no nível do server{}) porque qualquer "add_header" dentro de uma
# location apaga os herdados do server pra aquela location; incluir
# este arquivo em cada location garante que valem em todo lugar,
# inclusive nas que já têm seu próprio Cache-Control.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Câmera segue liberada (usada de propósito no scan de cartelas) —
# só restrita à própria origem; o resto desabilitado.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
# Política de segurança de conteúdo: a página só carrega o que vem do
# próprio servidor (nenhum script, fonte ou dado de site externo — o
# OCR e o QR Code ficam em vendor/). 'wasm-unsafe-eval' é exigido pelo
# motor do OCR (WebAssembly); blob: pelo worker do OCR e pelos
# arquivos gerados no navegador (exportação, manifest personalizado).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; connect-src 'self' blob: data:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; media-src 'self' blob: mediastream:; manifest-src 'self' blob: data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
# HSTS só nas conexões HTTPS ($bingo_hsts fica vazio em HTTP, e o nginx
# não envia cabeçalho vazio) — ver o map em nginx.conf.
add_header Strict-Transport-Security $bingo_hsts always;
