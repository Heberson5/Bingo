# Cabeçalhos de segurança comuns — num arquivo à parte (em vez de só
# no nível do server{}) porque qualquer "add_header" dentro de uma
# location apaga os herdados do server pra aquela location; incluir
# este arquivo em cada location garante que valem em todo lugar,
# inclusive nas que já têm seu próprio Cache-Control.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Câmera segue liberada (usada de propósito no scan de cartelas) —
# só restrita à própria origem; o resto desabilitado.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
