# Trecho compartilhado pelos server blocks do nginx.conf (acesso direto
# por IP, acesso pelo domínio, e futuramente o bloco HTTPS) — assim
# nenhum dos dois vira uma cópia levemente diferente do outro com o
# tempo. Ver nginx.conf.

root /usr/share/nginx/html;
index index.html;

gzip on;
gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml;
gzip_min_length 1024;

# HTML files change with every deploy — never let a browser/proxy cache
# a stale version of the app shell.
location ~* \.html$ {
    add_header Cache-Control "no-cache";
}

# The service worker file itself must never be cached — browsers already
# re-check it at most once a day regardless, but an explicit no-cache
# keeps an update from getting stuck behind a stale copy of sw.js.
location = /sw.js {
    default_type application/javascript;
    add_header Cache-Control "no-cache";
}

# nginx's stock mime.types has no entry for .webmanifest.
location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
}

# CSS/JS are safe to cache for a while; redeploys serve new bytes at
# the same path, so a short TTL is enough to avoid stale assets.
location ~* \.(?:css|js)$ {
    expires 1h;
    add_header Cache-Control "public";
}

location /icons/ {
    expires 7d;
    add_header Cache-Control "public";
}

# Backend (login, estado por usuário) — ver api/. "api" é o nome do
# serviço no docker-compose.yml, resolvido pela rede interna do Docker.
location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location / {
    try_files $uri $uri/ =404;
}
